<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V & A Wedding Invitation</title>
    <meta property="og:title" content="You're Invited to Our Wedding! 💌" />
    <meta property="og:description" content="V & A • Save the Date • Click to open our digital invitation." />
    <meta property="og:image" content="https://vergel-and-apple.github.io/wedding-invitation/envelope-preview.jpg" />
    <meta property="og:type" content="website" />
    <style>
        /* ── Hide Wix banner (CSS layer) ── */
        #WIX_ADS, #wix-ads,
        .wixads-mobile-indicator,
        [id^="WIX_ADS"],
        [class*="wix-ads"],
        iframe[src*="wix.com/ads"],
        iframe[src*="static.parastorage.com"],
        div[data-testid="wix-ads"] {
            display: none !important;
            visibility: hidden !important;
            height: 0 !important;
            max-height: 0 !important;
            overflow: hidden !important;
            pointer-events: none !important;
        }

        /* ── Reset ── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;   /* fully transparent — Wix page bg shows through */
            font-family: sans-serif;
        }

        /* ── Center ── */
        .wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            background: transparent;
        }

        /* ── Envelope — SQUARE (matches your actual image files) ── */
        .envelope {
            position: relative;
            width: min(92vw, 500px);   /* bigger than before */
            aspect-ratio: 1 / 1;       /* square — matches your PNGs */
            cursor: pointer;
            filter: drop-shadow(0 22px 55px rgba(0,0,0,0.50));
            transition: filter 0.3s ease;
        }
        .envelope:hover {
            filter: drop-shadow(0 30px 65px rgba(0,0,0,0.60));
        }

        /* ── Shared layer base ── */
        .layer {
            position: absolute;
            inset: 0;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* ── 1. Main pocket / body ── */
        .envelope-back {
            background-image: url('envelope-back.png');
            z-index: 10;
        }

        /* ── 2. Flap — hinge at the TOP edge, flips backward ── */
        .envelope-flap {
            background-image: url('envelope-flap.png');
            z-index: 30;
            transform-origin: top center;
            transition: transform 1.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ── 3. Wax seal — sits at the TOP-CENTER (flap tip) ── */
        .wax-seal {
            background-image: url('wax-seal.png');
            z-index: 40;

            /* Size: 18% of envelope width looks right for a tip seal */
            width: 18%;
            aspect-ratio: 1;
            height: auto;

            /* Override .layer inset so we can position freely */
            inset: unset;
            position: absolute;

            /* Top-center: ~10% from top, horizontally centred */
            top: 10%;
            left: 50%;
            transform: translateX(-50%) scale(1);
            transition: opacity 0.45s ease 0.15s,
                        transform 0.45s ease 0.15s;
        }

        /* ── Gentle gold pulse while closed ── */
        @keyframes seal-pulse {
            0%, 100% { filter: drop-shadow(0 0  0px rgba(218,180,80,0));   }
            50%       { filter: drop-shadow(0 0 14px rgba(218,180,80,0.75)); }
        }
        .envelope:not(.open) .wax-seal {
            animation: seal-pulse 2.4s ease-in-out infinite;
        }

        /* ── OPEN: flap flips 180° behind the pocket ── */
        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 5;
        }

        /* ── OPEN: seal breaks apart and vanishes ── */
        .envelope.open .wax-seal {
            opacity: 0;
            transform: translateX(-50%) scale(0.7) rotate(18deg);
            pointer-events: none;
        }

        /* ── "Tap to open" hint ── */
        .hint {
            position: absolute;
            bottom: -2rem;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.65);
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            white-space: nowrap;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .envelope.open .hint { opacity: 0; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="envelope" id="weddingEnvelope" onclick="openEnvelope()">
            <div class="layer envelope-back"></div>
            <div class="layer envelope-flap"></div>
            <div class="layer wax-seal"></div>
            <span class="hint">Tap to open</span>
        </div>
    </div>

    <script>
        function openEnvelope() {
            document.getElementById('weddingEnvelope').classList.add('open');
        }

        /* ── Kill Wix banner dynamically (it injects AFTER page load) ── */
        const wixTargets = [
            '#WIX_ADS','#wix-ads','.wixads-mobile-indicator',
            'iframe[src*="static.parastorage.com"]',
            'iframe[src*="wix.com/ads"]'
        ];
        function nukeWixAds() {
            wixTargets.forEach(sel =>
                document.querySelectorAll(sel).forEach(el => {
                    el.style.cssText =
                        'display:none!important;visibility:hidden!important;' +
                        'height:0!important;max-height:0!important;' +
                        'overflow:hidden!important;pointer-events:none!important;';
                })
            );
        }
        nukeWixAds();
        new MutationObserver(nukeWixAds)
            .observe(document.documentElement, { childList: true, subtree: true });
    </script>
</body>
</html>
